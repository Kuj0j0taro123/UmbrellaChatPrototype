<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>WebChat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h2 class="mt-4">Welcome to WebChat!</h2>
    <div id="chat-window" class="border rounded p-3 mb-3" style="height: 300px; overflow-y: auto;">
        <!-- Messages will appear here -->
    </div>
    <form id="chat-form" class="input-group">
        <input id="chat-input" type="text" class="form-control" placeholder="Type a message..." />
        <button class="btn btn-primary" type="submit">Send</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
    const socket = new SockJS('/websocket-chat');
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, function () {
        stompClient.subscribe('/topic/messages', function (message) {
            const chatWindow = document.getElementById('chat-window');
            const msg = JSON.parse(message.body);
            const messageElement = document.createElement('div');
            messageElement.textContent = msg.username + ": " + msg.content;
            chatWindow.appendChild(messageElement);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });
    });

    document.getElementById('chat-form').addEventListener('submit', function (event) {
        event.preventDefault();
        const input = document.getElementById('chat-input');
        const message = { username: 'You', content: input.value };
        stompClient.send('/app/sendMessage', {}, JSON.stringify(message));
        input.value = '';
    });
</script>
</body>
</html>
