<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>WebChat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .message {
            margin-bottom: 10px;
        }
        .message.user {
            text-align: right;
            color: white;
            background-color: #007bff;
            border-radius: 10px;
            padding: 8px 12px;
            display: inline-block;
        }
        .message.other {
            text-align: left;
            color: black;
            background-color: #f1f1f1;
            border-radius: 10px;
            padding: 8px 12px;
            display: inline-block;
        }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mt-4">Umbrella Chat</h2>
    <div id="chat-window" class="border rounded p-3 mb-3">
        <!-- Messages will appear here -->
        <div class="message" th:each="message : ${message_history}" th:classappend="${message.username == username ? 'user' : 'other'}">
            <span th:text="${message.username}">User</span>:
            <span th:text="${message.content}">Message content</span>
        </div>
    </div>
    <form id="chat-form" class="input-group">
        <input id="chat-input" type="text" class="form-control" placeholder="Type a message..." />
        <button class="btn btn-primary" type="submit">Send</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:inline="javascript">
    const username = /*[[${username}]]*/ ''; // Injected from the server

    const socket = new SockJS('/websocket-chat');
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, function () {
        stompClient.subscribe('/topic/messages', function (message) {
            const chatWindow = document.getElementById('chat-window');
            const msg = JSON.parse(message.body);

            const messageElement = document.createElement('div');
            messageElement.classList.add('message');
            messageElement.classList.add(msg.username === username ? 'user' : 'other');
            messageElement.textContent = msg.username + ": " + msg.content;

            const wrapper = document.createElement('div');
            wrapper.appendChild(messageElement);
            chatWindow.appendChild(wrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });
    });

    document.getElementById('chat-form').addEventListener('submit', function (event) {
        event.preventDefault();
        const input = document.getElementById('chat-input');
        const message = { username: username, content: input.value };
        stompClient.send('/app/sendMessage', {}, JSON.stringify(message));
        input.value = '';
    });
</script>
</body>
</html>
